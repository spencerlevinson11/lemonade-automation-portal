<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Login - Lemonade Stand Automation Portal</title>
</head>
<body>
    <h1>Login to Lemonade Stand Automation Portal</h1>

    {% if form.errors %}
        <p style="color: red;">
            Your username and password didn't match. Please try again.
        </p>
    {% endif %}

    <form method="post" action="{% url 'login' %}">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">Log in</button>
    </form>

    <p style="margin-top: 16px;">
        (Use the superuser you created with <code>createsuperuser</code>.)
    </p>
</body>
</html>
