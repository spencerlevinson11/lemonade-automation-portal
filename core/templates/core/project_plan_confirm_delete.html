<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Delete Project • {{ automation_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root{
      --bg-main:#020617;
      --bg-card:#0b1120;
      --accent:#facc15;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --border:#1f2937;
      --danger:#f97373;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; padding:24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, rgba(250, 204, 21, 0.16), transparent 55%) var(--bg-main);
      color:var(--text);
    }
    .container{ max-width:720px; margin:0 auto; }
    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00)) var(--bg-card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:16px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    }
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      gap:10px;
      padding:10px 14px;
      border-radius:12px;
      border:1px solid rgba(249,115,115,0.35);
      background: rgba(249,115,115,0.14);
      color: var(--danger);
      font-weight:800;
      cursor:pointer;
      text-decoration:none;
    }
    .btn-secondary{
      border-color: var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      font-weight:700;
    }
    .btn-secondary:hover{ background: rgba(255,255,255,0.05); }
    .muted{ color:var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <div style="margin-bottom:14px;">
      <a class="muted" href="{% url 'project_planner' %}">← Back to Project Planner</a>
    </div>

    <div class="card">
      <h2 style="margin:0 0 8px;">Delete this project?</h2>
      <p class="muted" style="margin:0 0 14px;">
        <strong>{{ project.project_name }}</strong>
      </p>

      <form method="post" style="display:flex; gap:10px; align-items:center;">
        {% csrf_token %}
        <button class="btn" type="submit">Confirm delete</button>
        <a class="btn btn-secondary" href="{% url 'project_planner' %}">Cancel</a>
      </form>
    </div>
  </div>
</body>
</html>
