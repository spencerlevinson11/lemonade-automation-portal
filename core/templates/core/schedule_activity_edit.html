<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ automation_name }}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root{
      --bg-main:#020617;
      --bg-card:#0b1120;
      --accent:#facc15;
      --accent-strong:#fbbf24;
      --text:#e5e7eb;
      --muted:#9ca3af;
      --border:#1f2937;
      --good:#4ade80;
      --danger:#f97373;
      --input: rgba(2, 6, 23, 0.6);
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; padding:24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, rgba(250, 204, 21, 0.16), transparent 55%) var(--bg-main);
      color:var(--text);
    }
    .container{ max-width:820px; margin:0 auto; }
    .topbar{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; }
    .title{ display:flex; align-items:center; gap:12px; }
    .badge{
      background: rgba(250,204,21,0.14);
      border:1px solid rgba(250,204,21,0.25);
      color: var(--accent-strong);
      padding:6px 10px;
      border-radius:999px;
      font-weight:700;
      font-size:12px;
      letter-spacing: .4px;
      text-transform: uppercase;
    }
    a{ color: var(--accent); text-decoration:none; }
    a:hover{ text-decoration:underline; }

    .card{
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.00)) var(--bg-card);
      border:1px solid var(--border);
      border-radius:16px;
      padding:16px;
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
    }

    label{
      display:block;
      font-size:12px;
      color: var(--muted);
      margin-bottom:6px;
      text-transform: uppercase;
      letter-spacing:.4px;
    }
    input, select, textarea{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--border);
      background: var(--input);
      color: var(--text);
      outline:none;
    }
    textarea{ resize:vertical; }
    .row{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
    .field{ margin-bottom:10px; }

    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      gap:10px;
      padding:10px 14px;
      border-radius:12px;
      border:1px solid rgba(250,204,21,0.35);
      background: rgba(250,204,21,0.14);
      color: var(--accent-strong);
      font-weight:800;
      cursor:pointer;
    }
    .btn:hover{ background: rgba(250,204,21,0.18); }
    .btn-secondary{
      border-color: var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      font-weight:700;
    }
    .btn-secondary:hover{ background: rgba(255,255,255,0.05); }
    .btn-danger{
      border-color: rgba(249,115,115,0.40);
      background: rgba(249,115,115,0.12);
      color: #fecaca;
      font-weight:900;
    }
    .btn-danger:hover{ background: rgba(249,115,115,0.18); }

    .actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .help{ color:var(--muted); font-size:13px; margin:0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="topbar">
      <div class="title">
        <span class="badge">Scheduling</span>
        <div>
          <div style="font-weight:900; font-size:18px; letter-spacing:.2px;">Edit Activity</div>
          <div class="help">Update details and save. You can return to the week view any time.</div>
        </div>
      </div>
      <div>
        <a class="btn btn-secondary" href="/automations/schedule/?d={{ back_d }}">Back to Week</a>
      </div>
    </div>

    <div class="card">
      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="back_d" value="{{ back_d }}">

        <div class="row">
          <div class="field">
            <label for="id_date">Date</label>
            {{ form.date }}
          </div>
          <div class="field">
            <label for="id_category">Category</label>
            {{ form.category }}
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="id_start_time">Start time</label>
            {{ form.start_time }}
          </div>
          <div class="field">
            <label for="id_end_time">End time</label>
            {{ form.end_time }}
          </div>
        </div>

        <div class="field">
          <label for="id_title">Title</label>
          {{ form.title }}
        </div>

        <div class="row">
          <div class="field">
            <label for="id_assigned_to">Assigned to</label>
            {{ form.assigned_to }}
          </div>
          <div class="field">
            <label for="id_status">Status</label>
            {{ form.status }}
          </div>
        </div>

        <div class="field">
          <label for="id_notes">Notes</label>
          {{ form.notes }}
        </div>

        <div class="actions">
          <button class="btn" type="submit">Save Changes</button>
          <a class="btn btn-secondary" href="/automations/schedule/?d={{ back_d }}">Cancel</a>
        </div>
      </form>

      <hr style="border:none; border-top:1px solid var(--border); margin:16px 0;">

      <form method="post" action="{% url 'schedule_activity_delete' activity.id %}" onsubmit="return confirm('Delete this activity?');">
        {% csrf_token %}
        <input type="hidden" name="back_d" value="{{ back_d }}">
        <button class="btn btn-danger" type="submit">Delete Activity</button>
      </form>
    </div>
  </div>
</body>
</html>
