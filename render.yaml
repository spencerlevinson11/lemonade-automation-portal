databases:
  - name: portal-db
    plan: free

services:
  - type: web
    name: automation-portal
    env: python
    plan: free
    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py migrate &&
      python manage.py collectstatic --noinput
    startCommand: gunicorn portal.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.1
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: portal-db
          property: connectionString

